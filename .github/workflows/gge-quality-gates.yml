name: GGE Quality Gates

on:
  pull_request:
    paths:
      - "generative-governance-engine/**"
      - ".github/workflows/gge-quality-gates.yml"
  push:
    paths:
      - "generative-governance-engine/**"
      - ".github/workflows/gge-quality-gates.yml"

permissions:
  contents: read

jobs:
  source-tests:
    name: "Source tests / ${{ matrix.os }} / Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      PYTHONPATH: ${{ github.workspace }}/generative-governance-engine/src
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Record candidate identity
        shell: bash
        run: |
          git rev-parse HEAD
          git rev-parse "HEAD^{tree}"

      - name: Compile source and tests
        run: python -m compileall -q generative-governance-engine/src generative-governance-engine/tests

      - name: Run complete unit and law regression suite
        run: python -m unittest discover -s generative-governance-engine/tests -v

      - name: Run reference example
        run: python -m generative_governance_engine.example

      - name: Confirm tests did not modify tracked content
        run: git diff --exit-code

  installed-package:
    name: "Installed package / ${{ matrix.os }} / Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package from repository candidate
        run: python -m pip install --disable-pip-version-check ./generative-governance-engine

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Run installed package outside repository tree
        working-directory: ${{ runner.temp }}
        run: python -m generative_governance_engine.example

  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Reject whitespace errors in the candidate diff
        run: git diff --check HEAD^ HEAD

      - name: Reject tracked generated/cache artifacts and conflict markers
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys

          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"],
          ).decode("utf-8").split("\0")
          tracked = [path for path in tracked if path]

          forbidden_names = {
              ".DS_Store",
              "Thumbs.db",
              ".coverage",
          }
          forbidden_parts = {
              "__pycache__",
              ".pytest_cache",
              ".mypy_cache",
              ".ruff_cache",
              ".venv",
              "htmlcov",
          }
          forbidden_suffixes = {".pyc", ".pyo"}
          failures = []

          for raw_path in tracked:
              path = pathlib.PurePosixPath(raw_path)
              if path.name in forbidden_names:
                  failures.append(f"forbidden tracked artifact: {raw_path}")
              if forbidden_parts.intersection(path.parts):
                  failures.append(f"forbidden tracked cache/output path: {raw_path}")
              if path.suffix in forbidden_suffixes:
                  failures.append(f"forbidden tracked bytecode: {raw_path}")

              data = pathlib.Path(raw_path).read_bytes()
              if b"\0" in data:
                  continue
              text = data.decode("utf-8", errors="replace")
              conflict_markers = ("<" * 7 + " ", ">" * 7 + " ", "|" * 7 + " ")
              if any(marker in text for marker in conflict_markers):
                  failures.append(f"possible unresolved merge marker: {raw_path}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print(f"repository integrity scan passed for {len(tracked)} tracked paths")

  coverage-gate:
    name: GGE coverage gate
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/generative-governance-engine/src
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install coverage tool
        run: python -m pip install --disable-pip-version-check coverage==7.16.1

      - name: Measure branch coverage
        run: python -m coverage run --branch --source=generative_governance_engine -m unittest discover -s generative-governance-engine/tests -v

      - name: Report core coverage
        run: python -m coverage report --show-missing --include="*/generative_governance_engine/__init__.py,*/generative_governance_engine/engine.py,*/generative_governance_engine/model.py"

      - name: Export machine-readable coverage
        run: python -m coverage json -o coverage.json --include="*/generative_governance_engine/__init__.py,*/generative_governance_engine/engine.py,*/generative_governance_engine/model.py"

      - name: Enforce statement and branch thresholds independently
        shell: python
        run: |
          import json
          import sys

          with open("coverage.json", "r", encoding="utf-8") as handle:
              totals = json.load(handle)["totals"]

          statements = totals["num_statements"]
          covered_statements = totals["covered_lines"]
          branches = totals["num_branches"]
          covered_branches = totals["covered_branches"]

          statement_pct = 100.0 if statements == 0 else covered_statements * 100.0 / statements
          branch_pct = 100.0 if branches == 0 else covered_branches * 100.0 / branches

          required_statement_pct = 100.0
          required_branch_pct = 100.0

          print(
              f"statements: {covered_statements}/{statements} = {statement_pct:.2f}% "
              f"(required {required_statement_pct:.2f}%)"
          )
          print(
              f"branches: {covered_branches}/{branches} = {branch_pct:.2f}% "
              f"(required {required_branch_pct:.2f}%)"
          )

          failures = []
          if statement_pct < required_statement_pct:
              failures.append("statement coverage threshold not met")
          if branch_pct < required_branch_pct:
              failures.append("branch coverage threshold not met")

          if failures:
              print("\n".join(failures))
              sys.exit(1)

      - name: Remove transient coverage evidence
        shell: bash
        run: rm -f .coverage coverage.json

  mutation-measure:
    name: GGE mutation measurement
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install mutation tester
        run: python -m pip install --disable-pip-version-check mutmut==3.8.0

      - name: Run bounded mutation measurement
        working-directory: generative-governance-engine
        run: |
          rm -rf mutants
          mutmut run

      - name: Report mutation results
        working-directory: generative-governance-engine
        run: mutmut results

      - name: Export mutation statistics
        working-directory: generative-governance-engine
        shell: bash
        run: |
          mutmut export-cicd-stats
          cat mutants/mutmut-cicd-stats.json

      - name: Enforce mutation kill-rate threshold
        working-directory: generative-governance-engine
        shell: python
        run: |
          import json
          import sys

          with open("mutants/mutmut-cicd-stats.json", "r", encoding="utf-8") as handle:
              stats = json.load(handle)

          killed = int(stats["killed"])
          total = int(stats["total"])
          survived = int(stats["survived"])
          required_kill_rate = 98.0

          if total <= 0:
              print("mutation gate has no measured mutants")
              sys.exit(1)

          kill_rate = killed * 100.0 / total
          print(
              f"mutation kill rate: {killed}/{total} = {kill_rate:.2f}% "
              f"(required {required_kill_rate:.2f}%; survived {survived})"
          )

          if kill_rate < required_kill_rate:
              print("mutation kill-rate threshold not met")
              sys.exit(1)

      - name: Show surviving mutant diffs
        working-directory: generative-governance-engine
        shell: bash
        run: |
          mutmut results | sed -n 's/^[[:space:]]*\([^:]*\): survived$/\1/p' > surviving-mutants.txt
          while IFS= read -r mutant; do
            echo "::group::$mutant"
            mutmut show "$mutant"
            echo "::endgroup::"
          done < surviving-mutants.txt
