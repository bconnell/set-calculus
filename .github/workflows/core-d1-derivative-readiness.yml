name: Core D1 Derivative Readiness

on:
  push:
    paths:
      - "CORE_0.1_COMPLETENESS_CHECKLIST.md"
      - "docs/conventional-calculus/README.md"
      - "docs/conventional-calculus/COMPATIBILITY_RECORD.schema.json"
      - "docs/conventional-calculus/examples/derivative/**"
      - "scripts/audit_core_d1_derivative_readiness.py"
      - ".github/workflows/core-d1-derivative-readiness.yml"
  pull_request:
    paths:
      - "CORE_0.1_COMPLETENESS_CHECKLIST.md"
      - "docs/conventional-calculus/README.md"
      - "docs/conventional-calculus/COMPATIBILITY_RECORD.schema.json"
      - "docs/conventional-calculus/examples/derivative/**"
      - "scripts/audit_core_d1_derivative_readiness.py"
      - ".github/workflows/core-d1-derivative-readiness.yml"

permissions:
  contents: read

jobs:
  audit:
    name: Validate blocked D1 derivative readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile D1 readiness tooling
        run: python -m py_compile scripts/audit_core_d1_derivative_readiness.py

      - name: Validate JSON syntax
        run: |
          python -m json.tool docs/conventional-calculus/COMPATIBILITY_RECORD.schema.json > /dev/null
          python -m json.tool docs/conventional-calculus/examples/derivative/record.json > /dev/null

      - name: Validate D1 readiness
        run: python scripts/audit_core_d1_derivative_readiness.py

      - name: Run D1 readiness self-tests
        run: python scripts/audit_core_d1_derivative_readiness.py --self-test

      - name: Capture structured D1 evidence
        if: always()
        run: python scripts/audit_core_d1_derivative_readiness.py --json
