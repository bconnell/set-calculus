[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generative-governance-engine"
version = "0.1.0"
description = "Executable reference engine for Intent-Driven Generative Math"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
gge-example = "generative_governance_engine.example:main"

[tool.mutmut]
source_paths = ["src/generative_governance_engine"]
pytest_add_cli_args_test_selection = ["tests/"]
mutate_only_covered_lines = true
